[package]
name = "spire"
version = "0.1.0"
edition = "2021"
description = "spire: a slay-the-spire-like deckbuilding roguelike for the terminal, vim keys only"

[[bin]]
name = "spire"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
